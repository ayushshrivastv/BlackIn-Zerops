name: Deploy to Zerops

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerops-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zerops CLI
        run: npm install --global @zerops/zcli@1.1.0

      - name: Authenticate with Zerops
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
        run: zcli login "$ZEROPS_TOKEN"

      - name: Deploy API service
        run: >-
          zcli service push "prLbFXrRRJumQubhswhlGw"
          --setup "api"
          --workspace-state clean
          --version-name "github-${GITHUB_SHA::7}"

      - name: Wait for Zerops builder to recycle
        run: sleep 45

      - name: Deploy web service
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if zcli service push "RriPt4naSxOTRFEAQASwag" \
              --setup "web" \
              --workspace-state clean \
              --version-name "github-${GITHUB_SHA::7}"; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Zerops rejected the web deployment after 3 attempts."
              exit 1
            fi

            echo "::warning::Zerops builder is still recycling; retrying in 60 seconds."
            sleep 60
          done
